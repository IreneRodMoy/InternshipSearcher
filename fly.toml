app = "internship-searcher"
primary_region = "yul"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8080"

[[mounts]]
  source = "internship_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
